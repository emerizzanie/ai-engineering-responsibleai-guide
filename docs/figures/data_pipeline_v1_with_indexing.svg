<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1060" viewBox="0 0 920 1060" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="460.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Data Pipeline V1 (PDF pathway) and Proposed Indexing Step</text>
<text x="460.0" y="56" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" font-style="italic">Built and run on S01 (NIST AI RMF 1.0) in Topic 3, audited in Topic 4. Dashed border = proposed.</text>
<rect x="190" y="80" width="400" height="60" rx="10" fill="#f3f3f1" stroke="#6b6b6b" stroke-width="2"/>
<text x="390.0" y="106.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d1d1d">Source</text>
<text x="390.0" y="123.5" text-anchor="middle" font-size="12.5" fill="#333">S01 PDF in data/raw/ (nist_ai_100-1_ai_rmf_1.0.pdf)</text>
<rect x="190" y="170" width="400" height="60" rx="10" fill="#e7f1fb" stroke="#2f6db5" stroke-width="2"/>
<text x="390.0" y="196.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d1d1d">Ingest</text>
<text x="390.0" y="213.5" text-anchor="middle" font-size="12.5" fill="#333">Pick the exact file (resolve_source)</text>
<rect x="190" y="260" width="400" height="60" rx="10" fill="#e7f1fb" stroke="#2f6db5" stroke-width="2"/>
<text x="390.0" y="286.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d1d1d">Inspect</text>
<text x="390.0" y="303.5" text-anchor="middle" font-size="12.5" fill="#333">Pages, characters, near-empty pages, repeated header</text>
<rect x="190" y="350" width="400" height="78" rx="10" fill="#e7f1fb" stroke="#2f6db5" stroke-width="2"/>
<text x="390.0" y="368.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d1d1d">Prepare / Transform</text>
<text x="390.0" y="385.5" text-anchor="middle" font-size="12.5" fill="#333">Page-aware chunks of 500 characters</text>
<text x="390.0" y="402.5" text-anchor="middle" font-size="12.5" fill="#333">Remove repeated header, join wrapped lines</text>
<text x="390.0" y="419.5" text-anchor="middle" font-size="12.5" fill="#333">Keep the PDF page number</text>
<rect x="190" y="458" width="400" height="60" rx="10" fill="#e5f4e4" stroke="#2e7d32" stroke-width="2"/>
<text x="390.0" y="484.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d1d1d">Validate Output</text>
<text x="390.0" y="501.5" text-anchor="middle" font-size="12.5" fill="#333">File exists, not empty, every chunk has text + page, SHA-256</text>
<rect x="190" y="548" width="400" height="60" rx="10" fill="#e5f4e4" stroke="#2e7d32" stroke-width="2"/>
<text x="390.0" y="574.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d1d1d">Record Lineage</text>
<text x="390.0" y="591.5" text-anchor="middle" font-size="12.5" fill="#333">Link source to output in the two manifest files</text>
<rect x="190" y="638" width="400" height="60" rx="10" fill="#f3f3f1" stroke="#6b6b6b" stroke-width="2"/>
<text x="390.0" y="664.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d1d1d">Prepared Output</text>
<text x="390.0" y="681.5" text-anchor="middle" font-size="12.5" fill="#333">prepared_text.jsonl: 238 chunks with source + page</text>
<rect x="190" y="728" width="400" height="96" rx="10" fill="#e5f4e4" stroke="#2e7d32" stroke-width="2"/>
<text x="390.0" y="755.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d1d1d">Quality Gate (Topic 4 audit)</text>
<text x="390.0" y="772.5" text-anchor="middle" font-size="12.5" fill="#333">Rule 1 (valid source reference): 238 of 238 pass</text>
<text x="390.0" y="789.5" text-anchor="middle" font-size="12.5" fill="#333">Rule 2 (real content): 234 pass, 4 fail → review list</text>
<text x="390.0" y="806.5" text-anchor="middle" font-size="12.5" fill="#333">Decision: GO WITH CONDITIONS</text>
<rect x="190" y="854" width="400" height="78" rx="10" fill="#e7f1fb" stroke="#2f6db5" stroke-width="2" stroke-dasharray="7,5"/>
<text x="390.0" y="881.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d1d1d">Embed + Index (proposed)</text>
<text x="390.0" y="898.0" text-anchor="middle" font-size="12.5" fill="#333">bge-small-en-v1.5 turns each chunk into a vector</text>
<text x="390.0" y="915.0" text-anchor="middle" font-size="12.5" fill="#333">ChromaDB stores it with record_id, source, page</text>
<polyline points="390.0,140 390.0,170" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="390.0,230 390.0,260" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="390.0,320 390.0,350" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="390.0,428 390.0,458" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="390.0,518 390.0,548" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="390.0,608 390.0,638" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="390.0,698 390.0,728" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="390.0,824 390.0,854" fill="none" stroke="#444" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<polyline points="390.0,932 390.0,968" fill="none" stroke="#444" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="390.0" y="986" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333" font-style="italic">To Knowledge Access (top-5 search in the architecture)</text>
<rect x="640" y="245" width="255" height="90" rx="10" fill="#fbebeb" stroke="#c62828" stroke-width="2"/>
<text x="767.5" y="269.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1d">Failure point 1: no text</text>
<text x="767.5" y="286.5" text-anchor="middle" font-size="11.5" fill="#333">Scanned PDF gives empty text</text>
<text x="767.5" y="303.5" text-anchor="middle" font-size="11.5" fill="#333">→ stop with a clear message,</text>
<text x="767.5" y="320.5" text-anchor="middle" font-size="11.5" fill="#333">no empty chunks (OCR needed)</text>
<rect x="640" y="443" width="255" height="90" rx="10" fill="#fbebeb" stroke="#c62828" stroke-width="2"/>
<text x="767.5" y="467.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1d">Failure point 2: bad output</text>
<text x="767.5" y="484.5" text-anchor="middle" font-size="11.5" fill="#333">File missing or empty, or a</text>
<text x="767.5" y="501.5" text-anchor="middle" font-size="11.5" fill="#333">chunk has no page number</text>
<text x="767.5" y="518.5" text-anchor="middle" font-size="11.5" fill="#333">→ stop and report, do not register</text>
<rect x="640" y="623" width="255" height="90" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/>
<text x="767.5" y="656.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1d">Repeatability check (Cell 9)</text>
<text x="767.5" y="673.0" text-anchor="middle" font-size="11.5" fill="#333">Run again, compare fingerprints</text>
<text x="767.5" y="690.0" text-anchor="middle" font-size="11.5" fill="#333">and mappings: PASS</text>
<polyline points="590,290 640,290" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<polyline points="590,488 640,488" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<polyline points="590,668 640,668" fill="none" stroke="#888" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<rect x="640" y="745" width="255" height="62" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="7,5"/>
<text x="767.5" y="764.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1d">Audit fixes (planned)</text>
<text x="767.5" y="781.0" text-anchor="middle" font-size="11.5" fill="#333">Remove &#x27;Page N&#x27; footer (42 chunks),</text>
<text x="767.5" y="798.0" text-anchor="middle" font-size="11.5" fill="#333">fix broken hyphen words</text>
<polyline points="640,776 590,776" fill="none" stroke="#888" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>

<text x="72" y="1030" text-anchor="start" font-size="12.5" font-weight="normal" fill="#333">Supporting part</text>
<rect x="190.0" y="1015" width="34" height="20" rx="5" fill="#e7f1fb" stroke="#2f6db5" stroke-width="2"/>
<text x="232.0" y="1030" text-anchor="start" font-size="12.5" font-weight="normal" fill="#333">Core data step</text>
<rect x="342.8" y="1015" width="34" height="20" rx="5" fill="#e5f4e4" stroke="#2e7d32" stroke-width="2"/>
<text x="384.8" y="1030" text-anchor="start" font-size="12.5" font-weight="normal" fill="#333">Check / record step</text>
<rect x="531.6" y="1015" width="34" height="20" rx="5" fill="#fbebeb" stroke="#c62828" stroke-width="2"/>
<text x="573.6" y="1030" text-anchor="start" font-size="12.5" font-weight="normal" fill="#333">Failure point</text>
<rect x="677.2" y="1015" width="34" height="20" rx="5" fill="#e7f1fb" stroke="#2f6db5" stroke-width="2" stroke-dasharray="6,4"/>
<text x="719.2" y="1030" text-anchor="start" font-size="12.5" font-weight="normal" fill="#333">Proposed</text>
